name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Generate snake animations
      - name: Generate Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            # Default light theme
            dist/github-snake.svg

            # Dark theme (clean GitHub style)
            dist/github-snake-dark.svg?palette=github-dark

            # 🌊 Ocean theme (smooth + aesthetic)
            dist/ocean-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

            # ⚡ Neon theme (very eye-catching)
            dist/neon-snake.svg?palette=github-dark&color_snake=#00ffcc&color_dots=#0f0f0f,#1a1a2e,#16213e,#0f3460,#533483

            # 🔥 Fire theme (bold look)
            dist/fire-snake.svg?color_snake=#ff4500&color_dots=#ffe5e5,#ff9999,#ff4d4d,#cc0000

            # 💚 Matrix theme (developer vibe)
            dist/matrix-snake.svg?palette=github-dark&color_snake=#00ff00&color_dots=#003300,#004d00,#006600,#008000,#00b300

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Deploy to output branch
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
